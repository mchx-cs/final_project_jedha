# Pile du portail du personnel (VM web-medical). La base est sur db-medical.
services:
  app:
    build: ./app
    restart: unless-stopped
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Aucun mot de passe du personnel ici : seed.py les demande à l'écran.
    # Durcissement : code en lecture seule, aucun pouvoir root, aucun gain
    # de privilèges possible. /tmp en mémoire pour les fichiers de travail
    # de Gunicorn.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
    # Aucun port publié : nginx reste le seul point d'entrée.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    networks:
      - frontend

networks:
  frontend:
