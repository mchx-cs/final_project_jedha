# Nouveau docker-compose.yml de la VM WEB, une fois la base déportée.
# Remplace l'ancien fichier par celui-ci (garde le même nom : docker-compose.yml).
services:
  app:
    build: ./app
    restart: unless-stopped
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_SECRETARY_USER: ${SEED_SECRETARY_USER}
      SEED_SECRETARY_PASSWORD: ${SEED_SECRETARY_PASSWORD}
    networks:
      - frontend
    # Toujours aucun port publié : nginx reste le seul point d'entrée.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - frontend

networks:
  frontend:
