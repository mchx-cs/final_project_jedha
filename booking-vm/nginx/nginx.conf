worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Le formulaire est ouvert au public : deux demandes par minute et par
    # adresse suffisent largement à un usage réel, et coupent court aux robots.
    map $request_method $rdv_ip  { POST $binary_remote_addr; default ""; }
    map $request_method $rdv_all { POST "rdv";               default ""; }
    limit_req_zone $rdv_ip  zone=rdv_ip:10m rate=2r/m;
    limit_req_zone $rdv_all zone=rdv_all:1m rate=30r/m;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

        client_max_body_size 32k;

        location / {
            limit_req zone=rdv_ip burst=3 nodelay;
	    limit_req zone=rdv_all burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://app:5000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
